<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לא נמצא · Vouch</title>
<meta name="description" content="העמוד לא נמצא.">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#fff;--fg:#1c1a1d;--muted:#6b6169;--line:#ece6ea;--brand:#c93672;--card:#faf6f8}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0d;--fg:#f5edf1;--muted:#b8a3ae;--line:#2a2429;--brand:#e64c8c;--card:#141216}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line)}
header .wrap{padding-top:16px;padding-bottom:12px}
.brand{font-size:24px;font-weight:800;color:var(--brand);text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:14px}
nav a{color:var(--muted);text-decoration:none;padding:4px 0}
nav a[aria-current=page]{color:var(--fg);font-weight:700}
main{padding:24px 0 48px}
h1{font-size:28px;line-height:1.3;margin:0 0 4px}
h2{font-size:19px;margin:32px 0 4px}
h3{font-size:16px;margin:20px 0 0}
p{margin:8px 0}ul{margin:8px 0;padding-inline-start:22px}li{margin:4px 0}
.meta{color:var(--muted);font-size:14px}
a{color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px 12px;margin:16px 0}
.note{color:var(--muted);font-size:14px}
.todo{background:#fff3b0;color:#5c4400;padding:1px 6px;border-radius:4px;font-weight:600}
.en{border-top:1px solid var(--line);margin-top:40px;padding-top:8px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:16px 0 32px}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/">Vouch</a><nav aria-label="ניווט"><a href="/privacy/">פרטיות</a><a href="/terms/">תנאי שימוש</a><a href="/cookies/">עוגיות</a><a href="/delete-account/">מחיקת חשבון</a><a href="/support/">תמיכה</a></nav></div></header>
<main><div class="wrap">
<h1>העמוד לא נמצא</h1><p><a href="/">חזרה</a></p>
</div></main>
<footer><div class="wrap">Vouch</div></footer>
</body>
</html>
